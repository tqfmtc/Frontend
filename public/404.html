<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - TQF Mohalla Tuition Centers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container { 
      text-align: center; 
      max-width: 500px; 
      padding: 2rem;
    }
    h1 { 
      font-size: 4rem; 
      margin-bottom: 1rem; 
      opacity: 0.9;
    }
    p { 
      font-size: 1.2rem; 
      margin-bottom: 2rem; 
      opacity: 0.8;
    }
    a { 
      display: inline-block;
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 500;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    a:hover { 
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Oops! Page not found.</p>
    <a href="/">← Back to Home</a>
  </div>

  <script>
    // Auto-redirect to SPA root after 3 seconds (SPA router will handle)
    setTimeout(() => {
      window.location.href = '/';
    }, 3000);
    
    // Also handle direct navigation for SPA routes
    if (window.location.pathname !== '/' && window.location.pathname !== '/404.html') {
      // Store intended path for SPA router
      sessionStorage.setItem('intendedPath', window.location.pathname);
    }
  </script>
</body>
</html>
